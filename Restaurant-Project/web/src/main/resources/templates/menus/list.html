<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Menus — Veil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/veil.css"/>
    <style>
        .menus-hero {
            padding: 3.5rem 0 2.5rem;
            border-bottom: 0.5px solid rgba(201,168,76,0.12);
        }
        .menus-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 4vw, 3.5rem);
            font-weight: 700; line-height: 1.05; color: var(--cream);
        }
        .menus-hero h1 em { font-style: italic; color: var(--gold); }
        .menus-hero p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem; color: var(--cream-dim); font-weight: 300;
            line-height: 1.65; max-width: 360px;
        }

        /* Menu list items */
        .menu-item {
            background: var(--off-black);
            border: 0.5px solid rgba(201,168,76,0.1);
            padding: 1.4rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.3s, background 0.3s;
            position: relative;
            overflow: hidden;
        }
        .menu-item:hover {
            border-color: rgba(201,168,76,0.35);
            background: rgba(201,168,76,0.02);
        }
        .menu-item-num {
            font-family: 'Playfair Display', serif;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: rgba(201,168,76,0.3);
            margin-right: 1.5rem;
            min-width: 1.5rem;
            text-align: right;
        }
        .menu-item-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--cream);
            flex: 1;
        }
        .menu-item-rule {
            height: 0.5px;
            background: linear-gradient(to right, transparent, rgba(201,168,76,0.08), transparent);
            margin: 0;
            border: none;
        }

        /* Empty state */
        .empty-state {
            background: var(--off-black);
            border: 0.5px solid rgba(201,168,76,0.12);
            padding: 5rem 2rem; text-align: center;
        }
        .empty-state-icon {
            font-size: 2.5rem; color: rgba(201,168,76,0.2);
            display: block; margin-bottom: 1.2rem;
        }
        .empty-state p { font-size: 0.85rem; color: var(--cream-dim); margin-bottom: 1.5rem; }
    </style>
</head>
<body>

<div th:replace="~{nav :: navbar}"></div>

<!-- Hero -->
<div class="menus-hero">
    <div class="container d-flex justify-content-between align-items-end flex-wrap gap-3">
        <div>
            <span class="veil-eyebrow">Kitchen</span>
            <h1>All <em>Menus</em></h1>
        </div>
        <div class="d-flex flex-column align-items-end gap-2">
            <p class="text-end d-none d-md-block">Curated collections for each evening.<br>Each menu tells a different story.</p>
            <a href="/menus/new" class="btn btn-veil-primary">+ Create Menu</a>
        </div>
    </div>
</div>

<div class="container py-5">

    <!-- Flash messages -->
    <div th:if="${param.success != null}" class="alert veil-alert success alert-dismissible fade show mb-4" role="alert">
        Menu created successfully.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert veil-alert error alert-dismissible fade show mb-4" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Count -->
    <div th:if="${!#lists.isEmpty(menus)}" class="mb-4">
        <span class="veil-eyebrow" th:text="${#lists.size(menus)} + ' menu' + (${#lists.size(menus)} != 1 ? 's' : '') + ' available'"></span>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(menus)}" class="empty-state">
        <span class="empty-state-icon">◈</span>
        <p>No menus have been created yet.<br>Build your first curated menu.</p>
        <a href="/menus/new" class="btn btn-veil-primary">Create Your First Menu</a>
    </div>

    <!-- Menu list -->
    <div th:if="${!#lists.isEmpty(menus)}" class="d-flex flex-column gap-0">
        <th:block th:each="menu, iter : ${menus}">
            <div class="menu-item">
                <span class="menu-item-num" th:text="${iter.count}"></span>
                <a th:href="@{/menus/{id}(id=${menu.id})}"
                   th:text="${menu.name}"
                   class="menu-item-name"
                   style="text-decoration:none;"></a>
            </div>
            <hr class="menu-item-rule" th:unless="${iter.last}"/>
        </th:block>
    </div>

</div>

<footer class="veil-footer">
    <div class="container">© 2025 Veil. All rights reserved.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
