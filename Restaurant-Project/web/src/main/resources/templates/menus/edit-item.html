<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Edit ' + ${item.name} + ' — Veil'">Edit Menu Item — Veil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/veil.css"/>
    <style>
        .edit-hero {
            padding: 3.5rem 0 2.5rem;
            border-bottom: 0.5px solid rgba(201,168,76,0.12);
            margin-bottom: 3rem;
        }
        .edit-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 3.5vw, 3rem);
            font-weight: 700; line-height: 1.05; color: var(--cream);
        }
        .form-panel {
            background: var(--off-black);
            border: 0.5px solid rgba(201,168,76,0.15);
            padding: 2.5rem;
            max-width: 600px;
        }
        .form-footer {
            border-top: 0.5px solid rgba(201,168,76,0.1);
            padding-top: 1.5rem; margin-top: 2rem;
            display: flex; gap: 0.75rem; align-items: center;
        }
        .breadcrumb-sub {
            font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase;
            color: var(--cream-dim); margin-bottom: 0.3rem;
        }
        .breadcrumb-sub a { color: var(--gold); text-decoration: none; }
        .breadcrumb-sub a:hover { text-decoration: underline; }
    </style>
</head>
<body class="admin-mode">

<div th:replace="~{nav :: navbar}"></div>

<div class="edit-hero">
    <div class="container">
        <p class="breadcrumb-sub">
            <a href="/menus">Menus</a> →
            <a th:href="@{/menus/{id}/edit(id=${menu.id})}" th:text="${menu.name}"></a> →
            Edit Item
        </p>
        <span class="veil-eyebrow">Editing Item</span>
        <h1 th:text="${item.name}">Item Name</h1>
    </div>
</div>

<div class="container">

    <div th:if="${errorMessage}" class="alert veil-alert error alert-dismissible fade show mb-4"
         style="max-width:600px;" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="form-panel">
        <form th:action="@{/menus/{menuId}/items/{itemId}/edit(menuId=${menu.id}, itemId=${item.id})}"
              th:object="${formRequest}"
              method="post"
              novalidate>

            <!-- Name -->
            <div class="mb-4">
                <label class="veil-label" for="name">
                    Item Name <span style="color:var(--gold);">*</span>
                </label>
                <input type="text" id="name" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                       class="form-control veil-input"/>
                <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback">
                    <span th:errors="*{name}"></span>
                </div>
            </div>

            <!-- Description -->
            <div class="mb-4">
                <label class="veil-label" for="description">
                    Description <span style="color:var(--gold);">*</span>
                </label>
                <textarea id="description" th:field="*{description}"
                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                          class="form-control veil-input" rows="3"></textarea>
                <div th:if="${#fields.hasErrors('description')}" class="invalid-feedback">
                    <span th:errors="*{description}"></span>
                </div>
            </div>

            <div class="form-footer">
                <button type="submit" class="btn btn-veil-primary">Save Changes</button>
                <a th:href="@{/menus/{id}/edit(id=${menu.id})}" class="btn btn-veil-ghost">Cancel</a>
            </div>

        </form>
    </div>
</div>

<footer class="veil-footer">
    <div class="container">© 2025 Veil. All rights reserved.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
