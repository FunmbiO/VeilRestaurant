<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${menu.name} + ' — Veil'">Menu Detail — Veil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/veil.css"/>
    <style>
        .detail-hero {
            padding: 3.5rem 0 2.5rem;
            border-bottom: 0.5px solid rgba(201,168,76,0.12);
            margin-bottom: 3rem;
        }
        .detail-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 700; line-height: 1.05; color: var(--cream);
        }

        .detail-panel {
            background: var(--off-black);
            border: 0.5px solid rgba(201,168,76,0.15);
            max-width: 640px;
        }
        .detail-panel-header {
            background: var(--charcoal);
            border-bottom: 0.5px solid rgba(201,168,76,0.15);
            padding: 1.2rem 2rem;
        }
        .detail-panel-header h5 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            color: var(--cream);
            margin: 0;
            font-size: 1rem;
        }
        .detail-panel-body {
            padding: 2rem;
        }
        .detail-field {
            margin-bottom: 1.8rem;
        }
        .detail-field:last-child {
            margin-bottom: 0;
        }
        .detail-rule {
            border: none;
            height: 0.5px;
            background: linear-gradient(to right, transparent, rgba(201,168,76,0.1), transparent);
            margin: 1.5rem 0;
        }
        .detail-panel-footer {
            border-top: 0.5px solid rgba(201,168,76,0.1);
            padding: 1.2rem 2rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        .description-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            color: var(--cream);
            line-height: 1.7;
            font-weight: 300;
        }
        .no-description {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            color: var(--cream-dim);
            font-style: italic;
        }
    </style>
</head>
<body class="admin-mode">

<div th:replace="~{nav :: navbar}"></div>

<!-- Hero -->
<div class="detail-hero">
    <div class="container">
        <span class="veil-eyebrow">Menu Detail</span>
        <h1 th:text="${menu.name}">Menu Name</h1>
        <span style="font-size:0.6rem; letter-spacing:0.12em; color:var(--cream-dim); text-transform:uppercase;">
    By <span th:text="${menu.createdByUsername != null ? menu.createdByUsername : '[Deleted User]'}"
             style="color:var(--gold);"></span>
</span>
    </div>
</div>

<div class="container">

    <div class="detail-panel">

        <div class="detail-panel-header">
            <h5>Menu Information</h5>
        </div>

        <div class="detail-panel-body">

            <!-- Name -->
            <div class="detail-field">
                <span class="veil-field-label">Name</span>
                <span class="veil-field-value" th:text="${menu.name}"></span>
            </div>

            <hr class="detail-rule"/>

            <!-- Description -->
            <div class="detail-field">
                <span class="veil-field-label">Description</span>
                <p class="description-value mb-0"
                   th:if="${menu.description != null and !#strings.isEmpty(menu.description)}"
                   th:text="${menu.description}"></p>
                <span class="no-description"
                      th:unless="${menu.description != null and !#strings.isEmpty(menu.description)}">
                    No description provided.
                </span>
            </div>

            <hr class="detail-rule"/>

            <!-- Created By -->
            <div class="detail-field">
                <span class="veil-field-label">Created By</span>
                <span class="veil-field-value"
                      th:text="${menu.createdBy == currentUserId ? menu.createdByUsername + ' (You)' : (menu.createdByUsername != null ? menu.createdByUsername : '[Deleted User]')}"></span>
            </div>

            <!-- Menu Items -->
            <div class="detail-field">
                <span class="veil-field-label">Menu Items</span>
                <div th:if="${#lists.isEmpty(menuItems)}"
                     style="font-size:0.88rem; color:var(--cream-dim); font-style:italic;">
                    No items on this menu yet.
                </div>
                <div th:unless="${#lists.isEmpty(menuItems)}" class="mt-2">
                    <div th:each="item, iter : ${menuItems}">
                        <div style="margin-bottom:0.8rem;">
                <span style="font-family:'Playfair Display',serif; font-size:0.95rem; color:var(--cream);"
                      th:text="${item.name}"></span>
                            <br/>
                            <span style="font-size:0.82rem; color:var(--cream-dim);"
                                  th:text="${item.description}"></span>
                        </div>
                        <hr th:unless="${iter.last}" style="border:none; height:0.5px;
                background:linear-gradient(to right,transparent,rgba(201,168,76,0.08),transparent); margin:0.5rem 0;"/>
                    </div>
                </div>
            </div>

            <!-- Created Date and Time -->
            <div class="detail-field">
                <span class="veil-field-label">Created</span>
                <span class="veil-field-value"
                      th:text="${#temporals.format(menu.createdDateTime, 'MMM dd, yyyy · HH:mm')}"></span>
            </div>

        </div>

        <div class="detail-panel-footer">
            <a href="/menus" class="btn btn-veil-sm back">← Back to Menus</a>
            <a th:if="${canSuggest}"
               th:href="@{/menus/{id}/suggest(id=${menu.id})}"
               class="btn btn-veil-sm">✦ Suggest</a>
            <a th:if="${canEdit}"
               th:href="@{/menus/{id}/edit(id=${menu.id})}"
               class="btn btn-veil-sm edit">✎ Edit</a>
            <a th:if="${canEdit}"
               th:href="@{/menus/{id}/delete(id=${menu.id})}"
               class="btn btn-veil-sm danger">⊘ Delete</a>
        </div>

    </div>

</div>

<footer class="veil-footer">
    <div class="container">© 2025 Veil. All rights reserved.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
