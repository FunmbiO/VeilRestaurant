<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Pop-Up Restaurant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div th:replace="~{nav :: nav}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <div class="card">
                <div class="card-header bg-dark text-white text-center">
                    <h4 class="mb-0">Login</h4>
                </div>
                <div class="card-body p-4">

                    <div th:if="${param.error}" class="alert alert-danger text-center">
                        Invalid username or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-secondary text-center">
                        You have been logged out.
                    </div>

                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username"
                                   th:value="${param.username}"
                                   class="form-control" placeholder="Enter username" required/>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" name="password"
                                   class="form-control" placeholder="Enter password" required/>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark">Login</button>
                        </div>

                    </form>

                </div>
                <div class="card-footer text-center text-muted">
                    Don't have an account? <a href="/register" class="text-dark">Register</a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
