<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Inbox — Veil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/veil.css"/>
</head>
<body class="admin-mode">

<div th:replace="~{nav :: navbar}"></div>

<div class="container py-5">
    <span class="veil-eyebrow">Feedback</span>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <h1 style="font-family:'Playfair Display',serif; color:var(--cream); font-size:2rem; margin:0;">
            My Inbox
        </h1>
        <div class="d-flex gap-2">
            <a th:href="@{/inbox(showAll=false)}"
               th:classappend="${!showAll} ? ' active' : ''"
               class="btn btn-veil-sm">Pending</a>
            <a th:href="@{/inbox(showAll=true)}"
               th:classappend="${showAll} ? ' active' : ''"
               class="btn btn-veil-sm">Show All</a>
        </div>
    </div>

    <div th:if="${successMessage}"
         class="alert veil-alert success alert-dismissible fade show mb-4" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${#lists.isEmpty(suggestions)}"
         style="background:var(--off-black); border:0.5px solid rgba(201,168,76,0.12);
                padding:4rem 2rem; text-align:center;">
        <span style="font-size:2rem; color:rgba(201,168,76,0.2); display:block; margin-bottom:1rem;">◈</span>
        <p style="color:var(--cream-dim); font-size:0.85rem;">No suggestions yet.</p>
    </div>

    <div th:unless="${#lists.isEmpty(suggestions)}" class="d-flex flex-column gap-2">
        <div th:each="s : ${suggestions}"
             style="background:var(--off-black); border:0.5px solid rgba(201,168,76,0.1); padding:1.5rem 2rem;">

            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
                <div>
                    <span th:text="${s.priority}"
                          th:style="${s.priority.name() == 'HIGH'} ? 'color:#e74c3c; font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase;'
                                   : (${s.priority.name() == 'NORMAL'} ? 'color:var(--gold); font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase;'
                                   : 'color:#3498db; font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase;')">
                    </span>
                    <span style="font-size:0.6rem; letter-spacing:0.1em; color:var(--cream-dim); margin-left:1rem;"
                          th:text="${s.status}"></span>
                </div>
                <span style="font-size:0.7rem; color:var(--cream-dim);"
                      th:text="${#temporals.format(s.createdDate, 'MMM dd, yyyy · HH:mm')}"></span>
            </div>

            <p style="color:var(--cream); font-size:0.95rem; margin-bottom:0.5rem;"
               th:text="${s.suggestionText}"></p>

            <div style="font-size:0.72rem; color:var(--cream-dim);">
                For:
                <a th:href="${s.targetType.name() == 'EVENT'} ? '/events/' + ${s.targetId} : '/menus/' + ${s.targetId}"
                   style="color:var(--gold);"
                   th:text="${s.targetName}"></a>
                · By: <span th:text="${s.createdByUsername}"></span>
            </div>
            <div th:if="${s.status.name() == 'PENDING'}" class="d-flex gap-2 mt-3">
                <form th:action="@{/inbox/suggestions/{id}/resolve(id=${s.id})}" method="post">
                    <button type="submit" class="btn btn-veil-sm edit">✓ Resolve</button>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="veil-footer">
    <div class="container">© 2025 Veil. All rights reserved.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
