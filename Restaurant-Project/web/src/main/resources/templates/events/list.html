<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Events - Pop-Up Restaurant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Pop-Up Restaurant</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/events">Events</a></li>
                <li class="nav-item"><a class="nav-link" href="/events/new">Create Event</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Events</h2>
        <a href="/events/new" class="btn btn-dark">+ Create Event</a>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(events)}" class="alert alert-secondary text-center py-5">
        <p class="mb-2">No events found.</p>
        <a href="/events/new" class="btn btn-dark btn-sm">Create your first event</a>
    </div>

    <!-- Events table -->
    <div th:if="${!#lists.isEmpty(events)}">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Price</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td>
                    <a th:href="@{/events/{id}(id=${event.id})}"
                       th:text="${event.name}"
                       class="text-decoration-none fw-semibold text-dark"></a>
                </td>
                <td th:text="${#temporals.format(event.startDate, 'MMM dd, yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(event.endDate, 'MMM dd, yyyy HH:mm')}"></td>
                <td th:text="${'$' + #numbers.formatDecimal(event.price, 1, 2)}"></td>
                <td>
                    <span th:if="${event.active}" class="badge bg-success">Active</span>
                    <span th:unless="${event.active}" class="badge bg-secondary">Inactive</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
