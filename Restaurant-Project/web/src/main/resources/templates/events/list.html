<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Events — Veil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/veil.css"/>
    <style>
        .events-hero {
            padding: 3.5rem 0 2.5rem;
            border-bottom: 0.5px solid rgba(201,168,76,0.12);
        }
        .events-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 4vw, 3.5rem);
            font-weight: 700; line-height: 1.05; color: var(--cream);
        }
        .events-hero h1 em { font-style: italic; color: var(--gold); }
        .events-hero p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem; color: var(--cream-dim); font-weight: 300;
            line-height: 1.65; max-width: 360px;
        }

        /* Empty state */
        .empty-state {
            background: var(--off-black);
            border: 0.5px solid rgba(201,168,76,0.12);
            padding: 5rem 2rem; text-align: center;
        }
        .empty-state-icon {
            font-size: 2.5rem; color: rgba(201,168,76,0.2);
            display: block; margin-bottom: 1.2rem;
        }
        .empty-state p { font-size: 0.85rem; color: var(--cream-dim); margin-bottom: 1.5rem; }

        /* Event cards grid */
        .event-card-item {
            background: var(--off-black);
            border: 0.5px solid rgba(201,168,76,0.1);
            transition: border-color 0.3s, background 0.3s;
            position: relative; overflow: hidden;
        }
        .event-card-item:hover { border-color: rgba(201,168,76,0.35); background: rgba(201,168,76,0.02); }
        .event-card-num {
            position: absolute; top: 1.2rem; right: 1.5rem;
            font-family: 'Playfair Display', serif; font-size: 3.5rem;
            color: rgba(201,168,76,0.05); line-height: 1; font-weight: 700;
            pointer-events: none;
        }
        .event-card-body { padding: 2rem; }
        .event-card-date {
            font-size: 0.55rem; letter-spacing: 0.25em; text-transform: uppercase;
            color: var(--gold); display: block; margin-bottom: 0.5rem;
        }
        .event-card-name {
            font-family: 'Playfair Display', serif; font-size: 1.2rem;
            font-weight: 400; color: var(--cream); text-decoration: none !important;
            display: block; margin-bottom: 0.3rem; transition: color 0.2s;
        }  
        .event-card-name:hover { color: var(--gold) !important; }
        .event-card-footer-strip {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem;
            border-top: 0.5px solid rgba(201,168,76,0.08);
        }
        .event-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem; color: var(--gold); font-weight: 500;
        }
        .event-actions { display: flex; gap: 0.5rem; align-items: center; }
    </style>
</head>
<body>

<div th:replace="~{nav :: navbar}"></div>

<!-- Page hero -->
<div class="events-hero">
    <div class="container d-flex justify-content-between align-items-end flex-wrap gap-3">
        <div>
            <span class="veil-eyebrow">Upcoming</span>
            <h1>All <em>Events</em></h1>
        </div>
        <div class="d-flex flex-column align-items-end gap-2">
            <p class="text-end d-none d-md-block">Intimate evenings in hidden venues.<br>Reserve your place before the world finds out.</p>
            <a href="/events/new" class="btn btn-veil-primary">+ Create Event</a>
        </div>
    </div>
</div>

<div class="container py-5">

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert veil-alert success alert-dismissible fade show mb-4" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert veil-alert error alert-dismissible fade show mb-4" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(events)}" class="empty-state">
        <span class="empty-state-icon">◈</span>
        <p>No events have been created yet.<br>Add your first evening to the calendar.</p>
        <a href="/events/new" class="btn btn-veil-primary">Create Your First Event</a>
    </div>

    <!-- Events grid -->
    <div th:if="${!#lists.isEmpty(events)}" class="row g-2">
        <div class="col-md-6 col-lg-4" th:each="event, iter : ${events}">
            <div class="event-card-item h-100 d-flex flex-column">
                <span class="event-card-num" th:text="${iter.count}"></span>
                <div class="event-card-body flex-grow-1">
                    <span class="event-card-date"
                          th:text="${#temporals.format(event.startDate, 'MMM dd, yyyy · HH:mm')}"></span>
                    <a th:href="@{/events/{id}(id=${event.id})}"
                       th:text="${event.name}"
                       class="event-card-name"></a>
                    <div class="d-flex align-items-center gap-2 mt-2">
                        <span th:if="${event.active}" class="veil-badge badge active">Active</span>
                        <span th:unless="${event.active}" class="veil-badge badge inactive">Inactive</span>
                        <span style="font-size:0.72rem; color:var(--cream-dim);"
                              th:text="${#temporals.format(event.endDate, 'Ends MMM dd')}"></span>
                    </div>
                </div>
                <div class="event-card-footer-strip">
                    <span class="event-price"
                          th:text="${'$' + #numbers.formatDecimal(event.price, 1, 2)}"></span>
                    <div class="event-actions">
                        <a th:href="@{/events/{id}/edit(id=${event.id})}"
                           class="btn btn-veil-sm edit" title="Edit Event">✎ Edit</a>
                        <a th:href="@{/events/{id}/delete(id=${event.id})}"
                           class="btn btn-veil-sm danger" title="Delete or Archive Event">⊘ Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<footer class="veil-footer">
    <div class="container">© 2025 Veil. All rights reserved.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
