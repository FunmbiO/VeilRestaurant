<!--suppress ThymeleafVariablesResolveInspection -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Event - Pop-Up Restaurant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div th:replace="~{nav :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="mb-3">
                <a href="/events" class="btn btn-outline-secondary btn-sm">Back to Events</a>
            </div>

            <h2 class="mb-4">Create Event</h2>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/events/new}" th:object="${createEventRequest}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="name" class="form-label">Event Name <span class="text-danger">*</span></label>
                            <input type="text" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   class="form-control" placeholder="Enter event name"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" th:field="*{description}"
                                      class="form-control" rows="3"
                                      placeholder="Optional description"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="startDate" class="form-label">Start Date and Time <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="startDate" th:field="*{startDate}"
                                       th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'"
                                       class="form-control"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('startDate')}"
                                     th:errors="*{startDate}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="endDate" class="form-label">End Date and Time <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="endDate" th:field="*{endDate}"
                                       th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid'"
                                       class="form-control"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('endDate')}"
                                     th:errors="*{endDate}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="durationMinutes" class="form-label">Duration (minutes)</label>
                                <input type="number" id="durationMinutes" th:field="*{durationMinutes}"
                                       th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid'"
                                       class="form-control" min="0" placeholder="e.g. 120"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('durationMinutes')}"
                                     th:errors="*{durationMinutes}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label">Price ($) <span class="text-danger">*</span></label>
                                <input type="number" id="price" th:field="*{price}"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                       class="form-control" min="0" step="0.01" placeholder="e.g. 49.99"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}"
                                     th:errors="*{price}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="active"
                                       th:field="*{active}" role="switch"/>
                                <label class="form-check-label" for="active">Active</label>
                            </div>
                            <small class="text-muted">Active events appear in the events list.</small>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-dark">Create Event</button>
                            <a href="/events" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
