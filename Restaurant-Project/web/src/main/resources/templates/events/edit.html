<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Edit ' + ${event.name} + ' - Pop-Up Restaurant'">Edit Event</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div th:replace="~{nav :: navbar}"></div>

<div class="container mt-4" style="max-width: 720px;">

    <div class="mb-3">
        <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline-secondary btn-sm">&larr; Back to Event</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">Edit Event</h4>
        </div>
        <div class="card-body">

            <!-- Service-level error message (e.g. duplicate name) -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/events/{id}/edit(id=${event.id})}"
                  th:object="${formRequest}"
                  method="post"
                  novalidate>

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Event Name <span class="text-danger">*</span></label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                           class="form-control"
                           placeholder="Enter event name"/>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Description</label>
                    <textarea id="description"
                              th:field="*{description}"
                              class="form-control"
                              rows="3"
                              placeholder="Optional event description"></textarea>
                </div>

                <!-- Start Date -->
                <div class="mb-3">
                    <label for="startDate" class="form-label fw-semibold">Start Date <span class="text-danger">*</span></label>
                    <input type="datetime-local"
                           id="startDate"
                           th:field="*{startDate}"
                           th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'"
                           class="form-control"/>
                    <div class="invalid-feedback" th:errors="*{startDate}"></div>
                </div>

                <!-- End Date -->
                <div class="mb-3">
                    <label for="endDate" class="form-label fw-semibold">End Date <span class="text-danger">*</span></label>
                    <input type="datetime-local"
                           id="endDate"
                           th:field="*{endDate}"
                           th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid'"
                           class="form-control"/>
                    <div class="invalid-feedback" th:errors="*{endDate}"></div>
                </div>

                <!-- Duration -->
                <div class="mb-3">
                    <label for="durationMinutes" class="form-label fw-semibold">Duration (minutes)</label>
                    <input type="number"
                           id="durationMinutes"
                           th:field="*{durationMinutes}"
                           th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid'"
                           class="form-control"
                           min="1"
                           placeholder="e.g. 90"/>
                    <div class="invalid-feedback" th:errors="*{durationMinutes}"></div>
                </div>

                <!-- Price -->
                <div class="mb-3">
                    <label for="price" class="form-label fw-semibold">Price ($) <span class="text-danger">*</span></label>
                    <input type="number"
                           id="price"
                           th:field="*{price}"
                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                           class="form-control"
                           step="0.01"
                           min="0.01"
                           placeholder="e.g. 75.00"/>
                    <div class="invalid-feedback" th:errors="*{price}"></div>
                </div>

                <!-- Active toggle -->
                <div class="mb-4">
                    <div class="form-check form-switch">
                        <input type="checkbox"
                               id="active"
                               th:field="*{active}"
                               class="form-check-input"
                               role="switch"/>
                        <label for="active" class="form-check-label fw-semibold">Active</label>
                    </div>
                    <div class="form-text text-muted">
                        Active events are visible to guests for reservation requests.
                    </div>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-dark">Save Changes</button>
                    <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Track whether the user has changed any form field
    let formDirty = false;

    const form = document.querySelector('form');

    // Mark form as dirty when any input or select changes
    form.querySelectorAll('input, textarea, select').forEach(function(field) {
        field.addEventListener('change', function() {
            formDirty = true;
        });
        field.addEventListener('input', function() {
            formDirty = true;
        });
    });

    // When the form is submitted normally, clear the dirty flag so no warning shows
    form.addEventListener('submit', function() {
        formDirty = false;
    });

    // Warn the user if they try to leave with unsaved changes
    window.addEventListener('beforeunload', function(e) {
        if (formDirty) {
            e.preventDefault();
            e.returnValue = ''; // Required for Chrome to show the dialog
        }
    });
</script>
</body>
</html>
