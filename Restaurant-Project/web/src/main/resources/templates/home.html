<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pop-Up Restaurant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Hero -->
<div class="container mt-5 text-center">
    <img src="/images/logo.png" alt="Restaurant Logo" class="mb-4"
         style="max-width: 150px;"
         onerror="this.style.display='none'"/>
    <h1 class="display-4 fw-bold">Pop-Up Restaurant</h1>
    <p class="lead text-muted">Welcome! Discover and manage our upcoming events.</p>
    <hr class="my-4"/>
    <div class="d-flex justify-content-center gap-3">
        <a href="/events" class="btn btn-dark btn-lg">View Events</a>
        <a href="/events/new" class="btn btn-outline-dark btn-lg">Create Event</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
