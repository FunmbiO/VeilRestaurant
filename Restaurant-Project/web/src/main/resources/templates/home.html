<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pop-Up Restaurant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Pop-Up Restaurant</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/events">Events</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/events/new">Create Event</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero -->
<div class="container mt-5 text-center">
    <img src="/images/logo.png" alt="Restaurant Logo" class="mb-4"
         style="max-width: 150px;"
         onerror="this.style.display='none'"/>
    <h1 class="display-4 fw-bold">Pop-Up Restaurant</h1>
    <p class="lead text-muted">Welcome! Discover and manage our upcoming events.</p>
    <hr class="my-4"/>
    <div class="d-flex justify-content-center gap-3">
        <a href="/events" class="btn btn-dark btn-lg">View Events</a>
        <a href="/events/new" class="btn btn-outline-dark btn-lg">Create Event</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
