<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register — Veil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/veil.css"/>
</head>
<body>

<div th:insert="~{nav :: navbar}"></div>

<div class="veil-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <!-- Page header -->
                <div class="veil-register-header">
                    <span class="veil-eyebrow">Membership</span>
                    <h1 class="veil-title">Join <em>Veil</em></h1>
                    <h4 style="font-family:'Cormorant Garamond',serif; color:var(--cream-dim); font-weight:300; font-size:1rem; letter-spacing:0.08em; margin-top:0.4rem;">
                        Create your member account
                    </h4>
                </div>

                <hr class="veil-rule">

                <div th:unless="${message == null}"
                     class="alert veil-alert warning alert-dismissible" role="alert">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="veil-card card">
                    <div class="card-body">

                        <!--/*@thymesVar id="user" type="nbcc.auth.domain.UserRegistration"*/-->
                        <form method="post" th:action="@{/register}" th:object="${user}">

                            <div class="mb-3">
                                <label class="veil-label">Username</label>
                                <input th:field="*{username}"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                                       class="form-control veil-input"
                                       placeholder="Choose a username"/>
                                <div class="invalid-feedback" th:errors="*{username}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="veil-label">Email</label>
                                <input th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       class="form-control veil-input"
                                       placeholder="your@email.com"/>
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>

                            <div class="mb-4">
                                <label class="veil-label">Password</label>
                                <input th:field="*{password}" type="password"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                       class="form-control veil-input"
                                       placeholder="••••••••••"/>
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>

                            <button type="submit" class="btn btn-veil-primary w-100">Create My Account</button>
                        </form>

                    </div>
                    <div class="card-footer text-center" style="font-size:0.74rem; color:var(--cream-dim);">
                        Already a member? <a href="/login" style="color:var(--gold); text-decoration:none;">Sign in →</a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<footer class="veil-footer">
    <div class="container">© 2025 Veil. All rights reserved.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
