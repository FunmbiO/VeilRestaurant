<!-- nav.html - NO DOCTYPE, NO html/body tags, just the fragment -->
<nav th:fragment="navbar"
     class="navbar navbar-expand-lg veil-nav"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container">
        <a class="navbar-brand" href="/">Veil</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/events">Events</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/menus">Menus</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/events/new">Create Event</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/menus/new">Create Menu</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/portal">Admin Portal</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center gap-2"
                sec:authorize="!isAuthenticated()">
                <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                <li class="nav-item">
                    <a href="/register" class="btn btn-nav-cta">Join Veil</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center gap-2"
                sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <span class="nav-link"
                          style="color: var(--cream-dim); font-size:0.72rem; letter-spacing:0.08em;">
                        Welcome, <strong sec:authentication="name"></strong>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit"
                                class="btn btn-veil-ghost btn-veil-sm">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
